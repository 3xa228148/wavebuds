name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;35.0.0" > /dev/null
      - name: Protocol tests
        run: ./test.sh
      - name: Build APK and Magisk module (throwaway signing key)
        run: |
          export ANDROID_SDK=$ANDROID_HOME WAVEBUDS_KEYSTORE=$RUNNER_TEMP/ci.jks
          ./build.sh
          ./module/make-zip.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wavebuds-ci-build
          path: |
            out/WaveBuds.apk
            out/WaveBuds-magisk.zip
